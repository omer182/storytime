name: PR Checks

on:
  pull_request:
    branches: [ main, master ]

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (type-checks + compiles)
        run: npm run build

      - name: Run tests
        run: npm test

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build (esbuild bundle)
        run: npm run build

  docker-build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  summary:
    needs: [ server, ui, docker-build-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Generate PR summary
        run: |
          echo "## ✅ PR Checks Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Server: build + system tests" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ UI: type-check + esbuild bundle" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Docker image builds" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ready for merge 🚀" >> $GITHUB_STEP_SUMMARY
